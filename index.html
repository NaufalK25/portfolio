<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <script>
      // Runs before first paint. A block keeps these names out of the global scope.
      {
        const html = document.documentElement;
        const matches = query => matchMedia(query).matches;
        // Storage access throws when site data is blocked: treat that as empty.
        const read = (storage, key) => {
          try {
            return globalThis[storage].getItem(key);
          } catch {
            return null;
          }
        };

        html.classList.add('js');
        if (!matches('(prefers-reduced-motion: reduce)')) html.classList.add('motion');

        // The loader runs once per visit, on the home page, on screens wider than a phone.
        const seen = read('sessionStorage', 'loaded');
        try {
          sessionStorage.setItem('loaded', '1');
        } catch {}
        if (seen || location.pathname !== '/' || matches('(max-width: 767px)')) html.classList.add('no-loader');

        const mode = read('localStorage', 'mode');
        if (mode === 'dark' || (!mode && matches('(prefers-color-scheme: dark)'))) html.classList.add('dark');
      }
    </script>
    <!--head-->
    <link
      rel="preload"
      href="/fonts/archivo-100_900-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/martian-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preconnect"
      href="https://res.cloudinary.com"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />
    <link
      rel="apple-touch-icon"
      href="/apple-touch-icon.png"
    />
    <meta
      name="theme-color"
      content="#E7E9E6"
    />
    <meta
      name="twitter:site"
      content="@NaufalK2511"
    />
  </head>

  <body>
    <a
      class="skip-link"
      href="#main"
      data-no-transition
      >Skip to content</a
    >
    <div
      id="curtain"
      aria-hidden="true"
    >
      <div class="curtain__panel"></div>
      <div class="curtain__panel"></div>
      <div class="curtain__panel"></div>
      <div class="curtain__panel"></div>
      <div class="curtain__panel"></div>
      <p class="curtain__query"></p>
    </div>
    <div
      id="loader"
      role="status"
      aria-label="Loading"
    >
      <div class="loader__inner">
        <p
          class="loader__req"
          data-loader-req
        >
          GET /api/repo
        </p>
        <p
          class="loader__count"
          data-loader-count
        >
          000
        </p>
      </div>
      <div
        class="loader__bar"
        data-loader-bar
      ></div>
    </div>
    <div id="root"><!--app-html--></div>
    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
